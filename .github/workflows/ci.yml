# Integración continua del pipeline de inferencia y monitoreo.
# En cada push o pull request a main:
#   1) pruebas: pytest sobre el cálculo de drift, el posprocesamiento y la configuración (sin Airflow).
#   2) imagen:  construye la imagen Docker del proyecto y verifica que los 3 DAG cargan sin errores.
# No usa el dataset real ni entrena modelos: eso no corresponde a un runner de CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Instalar dependencias de prueba
        run: pip install -r requirements-ci.txt
      - name: Correr pytest
        run: pytest -q tests

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de Airflow del proyecto
        run: docker build -t pipeline-inferencia:ci .
      - name: Validar que los DAG cargan
        run: docker run --rm -v "$PWD":/app -w /app pipeline-inferencia:ci python tests/validar_dags.py
