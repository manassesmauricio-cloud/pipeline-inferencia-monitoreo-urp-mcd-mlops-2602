# Configuración única de los tres DAGs (entrenamiento, inferencia y monitoreo).
airflow:
  dag_owner: "mlops-urp"
  retries: 1
  retry_delay_minutes: 2

mlflow:
  tracking_uri: "sqlite:///mlflow/mlflow.db"   # en docker compose se reemplaza por MLFLOW_TRACKING_URI
  exp_training: "URP_MCD_2602_entrenamiento"
  exp_inference: "URP_MCD_2602_inferencia"
  exp_monitoring: "URP_MCD_2602_monitoreo"
  model_name: "urp_mcd_2602_propension"
  champion_alias: "champion"

data:
  raw_dir: "data/raw"                  # caché local de los pN_extrac.csv (no se versiona)
  drive_folder: "1ZaKpwjUIt754fDc947y2FTFPLOmksig-"   # S14: carpeta del curso en Drive; los datos siempre se bajan de aquí
  processed_dir: "data/processed"
  inference_dir: "data/inference"      # salidas por periodo: data/inference/p7/...
  monitoring_dir: "data/monitoring"    # reportes por periodo: data/monitoring/p7/...
  target_col: "target"                 # target del dataset del curso (desde el próximo ciclo: target_venta_1)
  # identificadores, fechas técnicas, targets y variables que solo existen después de la venta (leakage).
  # Se listan también los nombres de versiones anteriores del dataset; los que no existen se ignoran.
  drop_cols: [partition, tip_doc, key_value, codunicocli, p_fecinformacion, fch_creacion,
              target, target_venta, target_venta_1, target_copamiento, copamiento, monto_aceptado]
  training_periods: [1, 2, 3, 4, 5]
  max_rows_train: 30000                # muestra para que el entrenamiento dure minutos

training:
  n_iter_hpo: 3
  cv_folds: 3
  n_jobs: -1
  test_size: 0.2
  random_state: 42
  decay_threshold: 10.0
  use_gpu: auto

inference:
  default_period: 7

# S14: CD autohospedado. Gate automático: el champion entrenado debe superar este AUC de test para seguir.
cd:
  auc_minimo: 0.70

monitoring:
  reference_period: 6                  # D10: mes OOT, no usado en el entrenamiento
  stages: [raw, preprocessed, score, grupo_ejec]
  psi_quantils: 10
  score_col: "score"
  grupo_col: "grupo_ejec"
  puntuacion_col: "puntuacion"
  rolling_window: 3                    # periodos para el PSI móvil
  inference_cores: 1                   # núcleos reservados para la inferencia (0..n-1)
  pin_cores: true                      # cada etapa de monitoreo en un núcleo distinto
